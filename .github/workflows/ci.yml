# Pipeline CI de BusInTunisia — voir docs/devops/02-pipeline.md pour le rôle, les entrées,
# les sorties et les conditions d'échec de chaque job.
#
#               ┌──► build ─────────────┬──► e2e
#   quality ────┤                       │
#               └──► backend (tests) ───┼──► docker (build → scan Trivy → ghcr.io)
#   security ───────────────────────────┘        └──► deploy-test (develop, approbation) → smoke tests
#
# Les noms des jobs « backend » et « e2e » sont exigés par la protection des branches main/develop :
# ne pas les renommer sans mettre à jour les règles de protection.
name: CI BusInTunisia

on:
  # Toute branche de travail est vérifiée dès son push, avant même l'ouverture de la PR.
  push:
    branches: [main, develop, "feature/**", "fix/**", "hotfix/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      perf:
        description: "Exécuter aussi le test de performance"
        type: boolean
        default: false

# Un nouveau push sur la même branche annule le pipeline précédent devenu inutile.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Moindre privilège : le jeton du pipeline ne peut que lire le dépôt.
permissions:
  contents: read

env:
  NODE_VERSION: 22
  # Base MariaDB jetable (service du job, détruite en fin de job, injoignable hors du runner) :
  # mot de passe sans valeur hors du pipeline, conservé en clair et justifié (docs/devops/05-configuration.md).
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_USER: root
  DB_PASSWORD: root
  TEST_DB_NAME: bus_in_tunisia_test
  # JWT_SECRET n'est plus écrit ici : il est généré aléatoirement à chaque exécution (étape « secret JWT éphémère »).

jobs:
  # ---------------------------------------------------------------------------
  # Qualité : linting / analyse statique ESLint du serveur et du client.
  # Quality gate : toute erreur ESLint, ou plus de 5 avertissements, fait échouer le pipeline
  # et bloque tous les jobs suivants (échec rapide, ~20 s).
  # ---------------------------------------------------------------------------
  quality:
    name: Qualité (lint et analyse statique)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client
      - name: ESLint serveur
        working-directory: server
        run: npx eslint . --max-warnings=5
      - name: ESLint client
        working-directory: client
        run: npx eslint . --max-warnings=5
      - name: Rapports ESLint (JSON, archivés même en cas d'échec)
        if: always()
        run: |
          mkdir -p reports
          (cd server && npx eslint . -f json -o ../reports/eslint-server.json) || true
          (cd client && npx eslint . -f json -o ../reports/eslint-client.json) || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rapports-qualite
          path: reports/

  # ---------------------------------------------------------------------------
  # Sécurité (DevSecOps) : secrets dans tout l'historique Git + vulnérabilités des dépendances.
  # Quality gates : un secret détecté, ou une vulnérabilité HAUTE/CRITIQUE dans une dépendance de
  # PRODUCTION, fait échouer le job et bloque la publication de l'image. Voir docs/devops/06-securite.md.
  # ---------------------------------------------------------------------------
  security:
    name: Sécurité (secrets et dépendances)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # historique complet : un secret supprimé d'un fichier reste dans les anciens commits

      - name: Détection de secrets (Gitleaks, tout l'historique)
        env:
          GITLEAKS_VERSION: "v8.30.1"
        run: |
          mkdir -p reports
          docker run --rm -v "${PWD}:/repo" "ghcr.io/gitleaks/gitleaks:${GITLEAKS_VERSION}" \
            git /repo --config /repo/.gitleaks.toml --redact --verbose \
            --report-format json --report-path /repo/reports/gitleaks.json

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit des dépendances (npm audit)
        run: |
          status=0
          for dir in server client; do
            echo "::group::npm audit — $dir (rapport complet, dev inclus)"
            (cd "$dir" && npm audit --json > "../reports/npm-audit-$dir.json"; npm audit) || true
            echo "::endgroup::"
            echo "Gate $dir : dépendances de production, sévérité ≥ high"
            (cd "$dir" && npm audit --omit=dev --audit-level=high) || status=1
          done
          exit $status

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rapports-securite
          path: reports/

  # ---------------------------------------------------------------------------
  # Construction : client React (vite build) + serveur sans dépendances de dev.
  # Sortie : artefact busintunisia-<version>-<sha court>, téléchargeable 30 jours.
  # ---------------------------------------------------------------------------
  build:
    name: Build et artefact versionné
    runs-on: ubuntu-latest
    needs: quality
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Calculer la version (package.json + commit)
        id: version
        run: |
          BASE=$(node -p "require('./server/package.json').version")
          SHA=$(git rev-parse --short=7 HEAD)
          echo "version=${BASE}-${SHA}" >> "$GITHUB_OUTPUT"
          echo "Version construite : ${BASE}-${SHA}"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Installer les dépendances du client (npm ci, reproductible)
        working-directory: client
        run: npm ci

      - name: Construire le client
        working-directory: client
        run: npm run build

      - name: Installer les dépendances de production du serveur
        working-directory: server
        run: npm ci --omit=dev

      - name: Assembler l'artefact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          OUT="dist/busintunisia-${VERSION}"
          mkdir -p "$OUT/server" "$OUT/client"
          cp -r server/index.js server/src server/package.json server/package-lock.json server/.env.example "$OUT/server/"
          cp -r client/dist "$OUT/client/dist"
          cat > "$OUT/VERSION" <<EOF
          version=${VERSION}
          commit=${GITHUB_SHA}
          ref=${GITHUB_REF_NAME}
          built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          pipeline=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          tar -czf "dist/busintunisia-${VERSION}.tar.gz" -C dist "busintunisia-${VERSION}"
          ls -lh dist/

      - name: Publier l'artefact dans le pipeline
        uses: actions/upload-artifact@v7
        with:
          name: busintunisia-${{ steps.version.outputs.version }}
          path: dist/busintunisia-${{ steps.version.outputs.version }}.tar.gz
          retention-days: 30
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Tests serveur : unitaires + intégration (seuils de couverture) + API Newman.
  # ---------------------------------------------------------------------------
  backend:
    name: Unitaires, intégration, couverture et API (régression)
    runs-on: ubuntu-latest
    needs: quality
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Générer un secret JWT éphémère (aléatoire, masqué dans les journaux)
        run: |
          SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$SECRET"
          echo "JWT_SECRET=$SECRET" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Tests unitaires + intégration avec seuils de couverture
        run: npm run test:coverage
      - name: Tests API Newman (suite de régression, hors défauts connus)
        run: npm run test:api:regression
      - name: Test de performance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.perf }}
        run: npm run test:perf
      # Résumé lisible directement sur la page du pipeline (onglet Summary).
      - name: Résumé des tests et de la couverture
        if: always()
        run: node tests/ciSummary.js >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rapports-backend
          path: |
            server/reports/junit/
            server/coverage/
            server/tests/api/reports/
            server/tests/perf/reports/

  # ---------------------------------------------------------------------------
  # Parcours d'interface Playwright, après un build et des tests serveur réussis.
  # ---------------------------------------------------------------------------
  e2e:
    name: Parcours d'interface (Playwright)
    runs-on: ubuntu-latest
    needs: [build, backend]
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Générer un secret JWT éphémère (aléatoire, masqué dans les journaux)
        run: |
          SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$SECRET"
          echo "JWT_SECRET=$SECRET" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client

      # Les navigateurs Playwright (~150 Mo) sont mis en cache, indexés sur la version de Playwright.
      - name: Version de Playwright
        id: pw
        working-directory: client
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache des navigateurs Playwright
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Installer Chromium (absent du cache)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: client
        run: npx playwright install --with-deps chromium
      - name: Installer les dépendances système de Chromium (cache présent)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: client
        run: npx playwright install-deps chromium

      - run: npm run test:e2e
        working-directory: client
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rapport-e2e
          path: |
            client/e2e-report/
            client/test-results/

  # ---------------------------------------------------------------------------
  # Image Docker : construite à chaque pipeline, publiée dans GitHub Container Registry (ghcr.io)
  # sauf pour les pull requests (le code d'une PR n'est pas encore validé : il n'est jamais publié).
  # Tags : <version>-<sha> (identique à l'artefact), sha-<sha>, nom de branche, version semver (tags v*),
  # latest (main uniquement). Voir docs/devops/04-conteneurisation.md.
  # ---------------------------------------------------------------------------
  docker:
    name: Image Docker (build, scan Trivy et publication)
    runs-on: ubuntu-latest
    needs: [build, backend, security]
    permissions:
      contents: read
      packages: write # publication dans ghcr.io avec le jeton éphémère du pipeline
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/busintunisia
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Connexion à ghcr.io (jeton GITHUB_TOKEN, aucun mot de passe stocké)
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculer les tags de l'image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.build.outputs.version }}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # 1) Construction chargée dans le démon Docker du runner, pour l'analyser AVANT toute publication.
      - name: Construire l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.build.outputs.version }}
            GIT_SHA=${{ github.sha }}
          # Cache des couches Docker entre pipelines (stockage de cache GitHub Actions).
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2) Scan de vulnérabilités de l'image (paquets Alpine + paquets npm embarqués) avec Trivy.
      #    Quality gate sécurité : une vulnérabilité CRITIQUE disposant d'un correctif bloque la publication.
      #    Trivy tourne depuis son image officielle à version figée : aucune action tierce n'est exécutée.
      - name: Scanner l'image (Trivy)
        env:
          TRIVY_VERSION: "0.76.2"
        run: |
          SCAN_TAG="${IMAGE}:sha-${GITHUB_SHA::7}"
          mkdir -p reports "${HOME}/.cache/trivy"
          trivy() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "${HOME}/.cache/trivy:/root/.cache/trivy" -v "${PWD}/reports:/reports" \
              "aquasec/trivy:${TRIVY_VERSION}" "$@"
          }
          # Rapport complet (toutes sévérités) archivé en JSON
          trivy image --quiet --format json --output /reports/trivy-image.json "$SCAN_TAG"
          # Tableau HIGH + CRITICAL dans le journal et dans le rapport texte
          trivy image --quiet --severity HIGH,CRITICAL "$SCAN_TAG" | tee reports/trivy-image.txt
          # Quality gate
          trivy image --quiet --exit-code 1 --ignore-unfixed --severity CRITICAL "$SCAN_TAG"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rapport-trivy
          path: reports/

      # 3) Publication (hors PR) : les couches viennent du cache, rien n'est reconstruit.
      - name: Publier dans ghcr.io
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.build.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha

      - name: Résumé de l'image
        run: |
          {
            echo "### Image Docker"
            echo ""
            if [ "$PUBLISH" = "true" ]; then echo "Publiée dans **ghcr.io** :"; else echo "Construite (non publiée : pull request) :"; fi
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Digest : \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Déploiement en environnement de TEST (continuous delivery).
  # - uniquement après fusion dans develop (push), jamais pour une PR ni une branche de travail ;
  # - « environment: test » : approbation manuelle requise (règle de l'environnement GitHub) et accès
  #   aux secrets TEST_* ; GitHub conserve l'historique des déploiements et la version déployée ;
  # - exécuté par le runner auto-hébergé du poste de test (label busintunisia-test) ;
  # - déploie l'image PUBLIÉE et scannée (sha-<commit>), vérifie (health + smoke tests),
  #   et revient automatiquement à la version précédente en cas d'échec (scripts/deploy.sh).
  # Voir docs/devops/07-deploiement.md.
  # ---------------------------------------------------------------------------
  deploy-test:
    name: Déploiement en test (smoke tests)
    needs: [docker, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, busintunisia-test]
    environment:
      name: test
      url: http://localhost:8080
    concurrency:
      group: deploy-test
      cancel-in-progress: false # un déploiement en cours n'est jamais interrompu
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Écrire les secrets de l'environnement hors du dépôt
        env:
          DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.TEST_DB_ROOT_PASSWORD }}
          JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
        run: |
          for v in DB_PASSWORD DB_ROOT_PASSWORD JWT_SECRET; do
            [ -n "${!v}" ] || { echo "::error::Secret TEST_${v} absent de l'environnement GitHub « test »"; exit 1; }
          done
          mkdir -p "$HOME/.busintunisia"
          umask 077
          printf 'DB_PASSWORD=%s\nDB_ROOT_PASSWORD=%s\nJWT_SECRET=%s\n' \
            "$DB_PASSWORD" "$DB_ROOT_PASSWORD" "$JWT_SECRET" > "$HOME/.busintunisia/test-secrets.env"

      - name: Déployer sha-${{ github.sha }} et vérifier
        run: bash scripts/deploy.sh "sha-${GITHUB_SHA::7}"

      - name: Historique des déploiements
        if: always()
        run: bash scripts/rollback.sh --list

      - name: Résumé du déploiement
        if: always()
        run: |
          {
            echo "### Déploiement en environnement de test"
            echo ""
            echo "- Image : \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/busintunisia:sha-${GITHUB_SHA::7}\`"
            echo "- URL : http://localhost:8080"
            echo "- Version en service : \`$(cat "$HOME/.busintunisia/test-current" 2>/dev/null || echo inconnue)\`"
            echo ""
            echo '```'
            cat reports/smoke-test.txt 2>/dev/null || echo "(pas de rapport de smoke tests)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rapport-deploiement-test
          path: reports/smoke-test.txt
